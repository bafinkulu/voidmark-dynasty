<style>
  :root{
    --void-0:#07060d;
    --void-1:#0e0c19;
    --void-2:#161225;

  .auth-card{

    background:linear-gradient(180deg, var(--void-2), var(--void-1));
    border:1px solid var(--line);
    border-radius:2px;
    padding:36px 32px 30px;

  .auth-card::before{

    position:absolute;

  }
  .sigil::before, .sigil::after{
    content:"";

    border:1px solid var(--gold);

  .sigil::after{

    border-color:var(--pulse);

  .auth-title{

    font-weight:700;
    font-size:26px;
    text-align:center;

    margin:0;
    color:var(--text-hi);

  .auth-sub{

    margin:4px 0 28px;

  .field label{

    color:var(--text-lo);
    margin-bottom:6px;

    width:100%;
    background:var(--void-0);

  .field input:focus{border-color:var(--pulse);}
  .field-hint{font-size:11px;color:var(--text-lo);margin-top:5px;}
  .btn-primary{

    background:var(--pulse);

    color:#0d0a1a;
    font-weight:600;

  /* chat panel */

    min-width:0;

</style>

<body>
 
<!-- ================= AUTH SCREEN ================= -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="sigil"></div>
    <h1 class="auth-title">VOIDMARK DYNASTY</h1>
    <p class="auth-sub" id="auth-mode-sub">Sign in to the clan comm channel</p>
 
    <div id="auth-error" class="auth-error hidden"></div>
 
    <form id="login-form">
      <div class="field">
        <label>Username</label>
        <input type="text" id="login-username" autocomplete="username" required maxlength="20">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Enter</button>
    </form>
 
    <form id="register-form" class="hidden">
      <div class="field">
        <label>Username</label>
        <input type="text" id="reg-username" autocomplete="username" required maxlength="20" pattern="[A-Za-z0-9_]{3,20}">
        <div class="field-hint">3–20 characters: letters, numbers, underscore.</div>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="reg-password" autocomplete="new-password" required minlength="6">
        <div class="field-hint">At least 6 characters.</div>
      </div>
      <div class="field">
        <label>Main Warframe <span style="color:var(--text-lo)">(optional)</span></label>
        <input type="text" id="reg-frame" maxlength="24" placeholder="e.g. Revenant">
      </div>
      <button type="submit" class="btn-primary" id="register-btn">Join the Dynasty</button>
    </form>
 
    <div class="auth-switch">
      <span id="switch-to-register">New Tenno? <a>Create an account</a></span>
      <span id="switch-to-login" class="hidden">Already enlisted? <a>Sign in</a></span>
    </div>
  </div>
</div>
 
<!-- ================= CHAT SCREEN ================= -->
<div id="chat-screen" class="hidden">
  <div class="topbar">
    <button id="menu-toggle">☰</button>
    <div class="clan-name">VOIDMARK <span>DYNASTY</span></div>
    <div class="spacer"></div>
    <div class="me-tag">Signed in as <b id="me-username"></b></div>
    <button class="btn-ghost" id="logout-btn">Log out</button>
  </div>
 
  <div class="body-wrap">
    <div id="roster-backdrop"></div>
    <div id="roster-panel">
      <div class="roster-list" style="padding-top:10px;">
        <div class="roster-nav-item active" id="nav-clan-chat">
          <div class="dot-icon"></div> Clan Comms
        </div>
      </div>
      <div class="roster-header">Members — <span id="member-count">0</span></div>
      <div class="roster-list" id="roster-list"></div>
    </div>
 
    <div id="chat-panel">
      <div class="chat-header">
        <div>
          <div class="chat-header-title" id="chat-title">Clan Comms</div>
          <div class="chat-header-sub" id="chat-subtitle">Visible to all of Voidmark Dynasty</div>
        </div>
      </div>
      <div id="messages"></div>
      <div id="typing-indicator" class="typing-indicator hidden"></div>
      <form class="composer" id="composer-form">
        <input type="text" id="message-input" placeholder="Message the clan…" maxlength="1000" autocomplete="off">
        <button type="submit" class="send-btn" id="send-btn">Send</button>
      </form>
    </div>
  </div>
</div>
 
<script>
/* ============================================================
   FIREBASE INIT
============================================================= */
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;
 
const FAKE_DOMAIN = "@voidmark.clan";
const HEARTBEAT_MS = 20000;
const ONLINE_WINDOW_MS = 45000;
const TYPING_THROTTLE_MS = 2500;  // min gap between typing-timestamp writes
const TYPING_TIMEOUT_MS = 5000;   // how long a typing timestamp is considered "live"
 
let currentUser = null;      // firebase auth user
let currentUsername = null;
let currentIsAdmin = false;  // mirrors users/{me}.isAdmin, kept live via unsubMe
let currentView = "clan";    // "clan" or a uid for DM
let usersCache = {};         // uid -> {username, mainFrame, lastSeen, isAdmin, banned}
let dmMetaCache = {};        // chatId -> {participants, unread, lastRead}
let unsubClanChat = null;
let unsubDM = null;
let unsubDMMeta = null;
let unsubTyping = null;
let unsubMe = null;          // live listener on my own users/{uid} doc (admin flag + ban check)
let heartbeatTimer = null;
let tickTimer = null;
let typingTickTimer = null;
let typingCache = {};        // uid -> {username, updatedAt}  (other users typing in current view)
let lastTypingWriteAt = 0;
let lastRenderedMsgs = [];   // cache of currently-displayed messages, for receipt re-renders
let editingMessageId = null; // guards against a snapshot re-render clobbering an in-progress edit
 
/* ============================================================
   HELPERS
============================================================= */
function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function initials(name){
  return (name || "?").slice(0,2).toUpperCase();
}
function dmChatId(uidA, uidB){
  return [uidA, uidB].sort().join("_");
}
function formatTime(ts){
  if (!ts || !ts.toDate) return "sending…";
  const d = ts.toDate();
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return sameDay ? time : d.toLocaleDateString([], {month:'short', day:'numeric'}) + " " + time;
}
function formatFullDateTime(ts){
  if (!ts || !ts.toDate) return "Sending…";
  const d = ts.toDate();
  return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'})
    + " · " + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function formatLastSeen(ts){
  if (!ts || !ts.toDate) return "Last seen unknown";
  const d = ts.toDate();
  const diffMs = Date.now() - d.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return "Last seen just now";
  if (diffMin < 60) return `Last seen ${diffMin}m ago`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `Last seen ${diffHr}h ago`;
  const diffDay = Math.floor(diffHr / 24);
  if (diffDay < 7) return `Last seen ${diffDay}d ago`;
  return "Last seen " + d.toLocaleDateString([], {month:'short', day:'numeric'});
}
function showAuthError(msg){
  const el = $("auth-error");
  el.textContent = msg;
  el.classList.remove("hidden");
}
function clearAuthError(){
  $("auth-error").classList.add("hidden");
}
function friendlyAuthError(err){
  const code = err && err.code;
  if (code === "auth/user-not-found" || code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials")
    return "Invalid username or password.";
  if (code === "auth/email-already-in-use")
    return "That username is already taken.";
  if (code === "auth/weak-password")
    return "Password must be at least 6 characters.";
  if (code === "auth/invalid-email")
    return "That username isn't valid.";
  if (code === "auth/too-many-requests")
    return "Too many attempts. Wait a moment and try again.";
  return err && err.message ? err.message : "Something went wrong.";
}
 
/* ============================================================
   AUTH SCREEN — LOGIN / REGISTER TOGGLE
============================================================= */
$("switch-to-register").querySelector("a").addEventListener("click", () => {
  clearAuthError();
  $("login-form").classList.add("hidden");
  $("register-form").classList.remove("hidden");
  $("switch-to-register").classList.add("hidden");
  $("switch-to-login").classList.remove("hidden");
  $("auth-mode-sub").textContent = "Create your Tenno account for the clan";
});
$("switch-to-login").querySelector("a").addEventListener("click", () => {
  clearAuthError();
  $("register-form").classList.add("hidden");
  $("login-form").classList.remove("hidden");
  $("switch-to-login").classList.add("hidden");
  $("switch-to-register").classList.remove("hidden");
  $("auth-mode-sub").textContent = "Sign in to the clan comm channel";
});
 
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAuthError();
  const username = $("login-username").value.trim();
  const password = $("login-password").value;
  if (!username || !password) return;
  $("login-btn").disabled = true;
  try {
    const email = username.toLowerCase() + FAKE_DOMAIN;
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  } finally {
    $("login-btn").disabled = false;
  }
});
 
$("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAuthError();
  const username = $("reg-username").value.trim();
  const password = $("reg-password").value;
  const mainFrame = $("reg-frame").value.trim();
  if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
    showAuthError("Username must be 3-20 characters: letters, numbers, underscore.");
    return;
  }
  $("register-btn").disabled = true;
  try {
    const email = username.toLowerCase() + FAKE_DOMAIN;
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection("users").doc(cred.user.uid).set({
      username: username,
      usernameLower: username.toLowerCase(),
      mainFrame: mainFrame || "",
      createdAt: FieldValue.serverTimestamp(),
      lastSeen: FieldValue.serverTimestamp()
    });
  } catch (err) {
    showAuthError(friendlyAuthError(err));
    $("register-btn").disabled = false;
  }
});
 
/* ============================================================
   AUTH STATE
============================================================= */
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    const snap = await db.collection("users").doc(user.uid).get();
    const data = snap.exists ? snap.data() : {username: user.email.split("@")[0]};
    currentUsername = data.username;
    currentIsAdmin = data.isAdmin === true;
 
    // Live-watch my own user doc so an admin toggling my isAdmin/banned flag
    // takes effect immediately without needing to reload.
    if (unsubMe) unsubMe();
    unsubMe = db.collection("users").doc(user.uid).onSnapshot((s) => {
      const d = s.data();
      if (!d) return;
      if (d.banned === true) {
        // Firestore rules already block this uid from writing anything;
        // this just gets them off the screen and back to the login form.
        alert("Your account has been suspended by an admin.");
        auth.signOut();
        return;
      }
      currentUsername = d.username || currentUsername;
      currentIsAdmin = d.isAdmin === true;
      if (currentUser) $("me-username").textContent = currentUsername;
      // admin status can change which action buttons render on messages/roster
      if (lastRenderedMsgs.length) renderMessages(lastRenderedMsgs);
      renderRoster();
    });
 
    enterChatScreen();
  } else {
    currentUser = null;
    currentIsAdmin = false;
    exitChatScreen();
  }
});
 
$("logout-btn").addEventListener("click", () => {
  auth.signOut();
});
 
/* ============================================================
   ENTER / EXIT CHAT SCREEN
============================================================= */
function enterChatScreen(){
  $("auth-screen").classList.add("hidden");
  $("chat-screen").classList.remove("hidden");
  $("me-username").textContent = currentUsername;
 
  subscribeRoster();
  subscribeDMMeta();
  openClanChat();
  startHeartbeat();
 
  // re-check every second so the typing indicator clears itself once a timestamp
  // goes stale, even if no new Firestore snapshot arrives
  typingTickTimer = setInterval(renderTypingIndicator, 1000);
 
  window.addEventListener("beforeunload", markOffline);
}
 
function exitChatScreen(){
  $("chat-screen").classList.add("hidden");
  $("auth-screen").classList.remove("hidden");
  $("login-username").focus();
 
  if (unsubClanChat) unsubClanChat();
  if (unsubDM) unsubDM();
  if (unsubDMMeta) unsubDMMeta();
  if (unsubTyping) unsubTyping();
  if (unsubMe) { unsubMe(); unsubMe = null; }
  stopHeartbeat();
  clearInterval(typingTickTimer);
  usersCache = {};
  dmMetaCache = {};
  typingCache = {};
  lastRenderedMsgs = [];
  editingMessageId = null;
}
 
/* ============================================================
   PRESENCE (heartbeat-based, no Realtime DB needed)
============================================================= */
function startHeartbeat(){
  touchPresence();
  heartbeatTimer = setInterval(touchPresence, HEARTBEAT_MS);
  tickTimer = setInterval(renderRoster, 10000);
}
function stopHeartbeat(){
  clearInterval(heartbeatTimer);
  clearInterval(tickTimer);
}
function touchPresence(){
  if (!currentUser) return;
  db.collection("users").doc(currentUser.uid).update({
    lastSeen: FieldValue.serverTimestamp()
  }).catch(()=>{});
}
function markOffline(){
  if (!currentUser) return;
  navigator.sendBeacon && db.collection("users").doc(currentUser.uid).update({
    lastSeen: firebase.firestore.Timestamp.fromDate(new Date(Date.now() - ONLINE_WINDOW_MS - 1000))
  }).catch(()=>{});
}
 
/* ============================================================
   ROSTER
============================================================= */
function subscribeRoster(){
  db.collection("users").orderBy("usernameLower").onSnapshot((qs) => {
    usersCache = {};
    qs.forEach(doc => { usersCache[doc.id] = doc.data(); });
    renderRoster();
  });
}
 
function renderRoster(){
  const list = $("roster-list");
  const ids = Object.keys(usersCache).filter(id => id !== (currentUser && currentUser.uid));
  $("member-count").textContent = Object.keys(usersCache).length;
 
  if (currentView !== "clan") updateDMSubtitle(currentView);
 
  if (ids.length === 0) {
    list.innerHTML = '<div class="system-note" style="padding:14px 4px;">No other Tenno enlisted yet.</div>';
    return;
  }
 
  list.innerHTML = ids.map(uid => {
    const u = usersCache[uid];
    const online = isOnline(u.lastSeen);
    const chatId = currentUser ? dmChatId(currentUser.uid, uid) : null;
    const meta = dmMetaCache[chatId];
    const unread = meta && meta.unread && meta.unread[currentUser.uid] ? meta.unread[currentUser.uid] : 0;
    const active = currentView === uid ? "active" : "";
    const banned = u.banned === true;
    const banBtn = currentIsAdmin ? `
        <button type="button" class="btn-ghost roster-ban-btn" data-uid="${uid}"
          title="${banned ? 'Lift suspension' : 'Suspend this user'}"
          style="flex:none;padding:4px 8px;font-size:11px;${banned ? 'border-color:var(--online);color:var(--online);' : 'border-color:var(--danger);color:var(--danger);'}">
          ${banned ? 'Unban' : 'Ban'}
        </button>` : "";
    return `
      <div class="roster-item ${active}" data-uid="${uid}" style="${banned ? 'opacity:0.5;' : ''}">
        <div class="avatar">${escapeHtml(initials(u.username))}<div class="status-dot ${online ? 'online':''}"></div></div>
        <div class="roster-item-info">
          <div class="roster-item-name">${escapeHtml(u.username)}${u.isAdmin ? ' <span style="color:var(--gold);font-size:10px;">★</span>' : ''}${banned ? ' <span style="color:var(--danger);font-size:10px;">(banned)</span>' : ''}</div>
          <div class="roster-item-sub">${online ? (u.mainFrame ? escapeHtml(u.mainFrame) : "Online") : escapeHtml(formatLastSeen(u.lastSeen))}</div>
        </div>
        ${unread > 0 ? `<div class="unread-badge">${unread > 9 ? '9+' : unread}</div>` : ""}
        ${banBtn}
      </div>`;
  }).join("");
 
  list.querySelectorAll(".roster-item").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest(".roster-ban-btn")) return; // handled separately below
      openDM(el.getAttribute("data-uid"));
      closeMobileRoster();
    });
  });
 
  list.querySelectorAll(".roster-ban-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const uid = btn.getAttribute("data-uid");
      toggleBan(uid);
    });
  });
}
 
/* ============================================================
   ADMIN: KICK / BAN
   Firestore rules only let a request whose caller's own
   users/{uid}.isAdmin == true flip the `banned` field on someone
   else's user doc. Once banned, the rules block that uid from
   writing (sending messages, typing, DMs) anywhere in the app,
   and the live listener on their own doc above force-signs them
   out. Note: this cannot stop the uid from *authenticating* with
   Firebase Auth itself (that requires the Admin SDK / a Cloud
   Function to disable the account) — it blocks them at the
   Firestore layer and boots them from the UI the moment it happens.
============================================================= */
function toggleBan(uid){
  const u = usersCache[uid];
  if (!u) return;
  const nextBanned = !(u.banned === true);
  if (!confirm(`${nextBanned ? 'Ban' : 'Unban'} ${u.username}?`)) return;
  db.collection("users").doc(uid).update({ banned: nextBanned })
    .catch(err => alert("Action failed: " + (err.message || err)));
}
 
function updateDMSubtitle(uid){
  const u = usersCache[uid];
  if (!u) { $("chat-subtitle").textContent = "Private message · not visible to other clan members"; return; }
  const status = isOnline(u.lastSeen) ? "Online now" : formatLastSeen(u.lastSeen);
  $("chat-subtitle").textContent = `Private message · ${status}`;
}
 
function isOnline(lastSeen){
  if (!lastSeen || !lastSeen.toDate) return false;
  return (Date.now() - lastSeen.toDate().getTime()) < ONLINE_WINDOW_MS;
}
 
/* track unread badges across all my DMs */
function subscribeDMMeta(){
  unsubDMMeta = db.collection("dms").where("participants", "array-contains", currentUser.uid)
    .onSnapshot((qs) => {
      dmMetaCache = {};
      qs.forEach(doc => { dmMetaCache[doc.id] = doc.data(); });
      renderRoster();
      // lastRead may have just changed for the thread we're looking at — refresh checkmarks
      if (currentView !== "clan" && lastRenderedMsgs.length) renderMessages(lastRenderedMsgs);
    });
}
 
/* ============================================================
   CLAN CHAT (public channel)
============================================================= */
$("nav-clan-chat").addEventListener("click", () => {
  openClanChat();
  closeMobileRoster();
});
 
function openClanChat(){
  currentView = "clan";
  $("nav-clan-chat").classList.add("active");
  $("chat-title").textContent = "Clan Comms";
  $("chat-subtitle").textContent = "Visible to all of Voidmark Dynasty";
  $("message-input").placeholder = "Message the clan…";
  renderRoster();
 
  if (unsubDM) { unsubDM(); unsubDM = null; }
  if (unsubClanChat) unsubClanChat();
 
  $("messages").innerHTML = '<div class="system-note">Loading transmissions…</div>';
  unsubClanChat = db.collection("clanChat").orderBy("createdAt", "asc").limitToLast(200)
    .onSnapshot((qs) => {
      const msgs = [];
      qs.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
      renderMessages(msgs);
    });
 
  subscribeTyping();
}
 
/* ============================================================
   PRIVATE MESSAGES
============================================================= */
function openDM(uid){
  currentView = uid;
  $("nav-clan-chat").classList.remove("active");
  const u = usersCache[uid] || {username: "Unknown"};
  $("chat-title").textContent = u.username;
  updateDMSubtitle(uid);
  $("message-input").placeholder = `Message ${u.username}…`;
  renderRoster();
 
  if (unsubClanChat) { unsubClanChat(); unsubClanChat = null; }
  if (unsubDM) unsubDM();
 
  const chatId = dmChatId(currentUser.uid, uid);
 
  // reset my unread count for this thread, and mark it read as of now
  db.collection("dms").doc(chatId).set({
    participants: [currentUser.uid, uid],
    unread: { [currentUser.uid]: 0 },
    lastRead: { [currentUser.uid]: FieldValue.serverTimestamp() }
  }, { merge: true }).catch(()=>{});
 
  $("messages").innerHTML = '<div class="system-note">Loading transmissions…</div>';
  unsubDM = db.collection("dms").doc(chatId).collection("messages")
    .orderBy("createdAt", "asc").limitToLast(200)
    .onSnapshot((qs) => {
      const msgs = [];
      qs.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
      renderMessages(msgs);
    });
 
  subscribeTyping();
}
 
/* ============================================================
   RENDER MESSAGES
============================================================= */
function renderMessages(msgs){
  lastRenderedMsgs = msgs;
 
  // don't stomp on an in-progress edit box when a snapshot fires mid-edit
  if (editingMessageId && msgs.some(m => m.id === editingMessageId)) return;
 
  const box = $("messages");
  const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
 
  if (msgs.length === 0) {
    box.innerHTML = '<div class="system-note">No transmissions yet. Say something to the Dynasty.</div>';
    return;
  }
 
  const inDM = currentView !== "clan";
  const dmMeta = inDM ? dmMetaCache[dmChatId(currentUser.uid, currentView)] : null;
  const otherLastRead = dmMeta && dmMeta.lastRead ? dmMeta.lastRead[currentView] : null;
 
  box.innerHTML = msgs.map(m => {
    const own = currentUser && m.uid === currentUser.uid;
 
    let receiptHtml = "";
    if (own && inDM) {
      const isRead = !!(otherLastRead && otherLastRead.toDate && m.createdAt && m.createdAt.toDate
        && otherLastRead.toDate().getTime() >= m.createdAt.toDate().getTime());
      receiptHtml = `<span class="msg-receipt ${isRead ? 'read' : ''}" title="${isRead ? 'Read' : 'Sent'}">${isRead ? '✓✓' : '✓'}</span>`;
    }
 
    const canEdit = own;
    const canDelete = own || currentIsAdmin;
    const actionsHtml = (canEdit || canDelete) ? `
        <div class="msg-actions">
          ${canEdit ? '<button type="button" class="msg-action-btn edit-btn" title="Edit message">✎</button>' : ''}
          ${canDelete ? `<button type="button" class="msg-action-btn delete-btn" title="${own ? 'Delete message' : 'Delete message (admin)'}">🗑</button>` : ''}
        </div>` : "";
 
    return `
      <div class="msg-row ${own ? 'own':''}" data-id="${m.id}">
        <div class="msg-avatar">${escapeHtml(initials(m.username))}</div>
        <div class="msg-body">
          <div class="msg-meta">
            <span class="msg-author">${escapeHtml(m.username)}</span>
            <span class="msg-time" title="${escapeHtml(formatFullDateTime(m.createdAt))}">${formatTime(m.createdAt)}</span>
            ${m.edited ? '<span class="msg-edited">(edited)</span>' : ''}
            ${receiptHtml}
          </div>
          <div class="msg-text" data-raw="${escapeHtml(m.text)}">${escapeHtml(m.text)}</div>
        </div>
        ${actionsHtml}
      </div>`;
  }).join("");
 
  if (wasAtBottom || msgs[msgs.length-1].uid === (currentUser && currentUser.uid)) {
    box.scrollTop = box.scrollHeight;
  }
}
 
/* ============================================================
   EDIT / DELETE OWN MESSAGES
============================================================= */
function currentMessagesCollectionRef(){
  if (currentView === "clan") return db.collection("clanChat");
  const chatId = dmChatId(currentUser.uid, currentView);
  return db.collection("dms").doc(chatId).collection("messages");
}
 
function startEditMessage(row){
  const msgId = row.getAttribute("data-id");
  const textEl = row.querySelector(".msg-text");
  if (!textEl) return;
  const raw = textEl.getAttribute("data-raw") || "";
 
  editingMessageId = msgId;
 
  const input = document.createElement("textarea");
  input.className = "msg-edit-input";
  input.value = raw;
  input.rows = 1;
  textEl.replaceWith(input);
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
 
  let settled = false;
  const commit = () => {
    if (settled) return;
    settled = true;
    editingMessageId = null;
    const newText = input.value.trim();
    if (newText && newText !== raw) {
      currentMessagesCollectionRef().doc(msgId).update({
        text: newText,
        edited: true,
        editedAt: FieldValue.serverTimestamp()
      }).catch(err => alert("Edit failed: " + (err.message || err)));
    } else {
      renderMessages(lastRenderedMsgs); // restore original view (also covers empty edit = no-op)
    }
  };
  const cancel = () => {
    if (settled) return;
    settled = true;
    editingMessageId = null;
    renderMessages(lastRenderedMsgs);
  };
 
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commit(); }
    else if (e.key === "Escape") { e.preventDefault(); cancel(); }
  });
  input.addEventListener("blur", commit);
}
 
function deleteMessage(row){
  const msgId = row.getAttribute("data-id");
  if (!confirm("Delete this message? This can't be undone.")) return;
  currentMessagesCollectionRef().doc(msgId).delete()
    .catch(err => alert("Delete failed: " + (err.message || err)));
}
 
$("messages").addEventListener("click", (e) => {
  const editBtn = e.target.closest(".edit-btn");
  const deleteBtn = e.target.closest(".delete-btn");
  if (editBtn) {
    startEditMessage(editBtn.closest(".msg-row"));
  } else if (deleteBtn) {
    deleteMessage(deleteBtn.closest(".msg-row"));
  }
});
 
/* ============================================================
   SENDING MESSAGES
============================================================= */
$("composer-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("message-input");
  const text = input.value.trim();
  if (!text || !currentUser) return;
  input.value = "";
  $("send-btn").disabled = true;
  clearTypingFlag();
 
  try {
    if (currentView === "clan") {
      await db.collection("clanChat").add({
        uid: currentUser.uid,
        username: currentUsername,
        text: text,
        createdAt: FieldValue.serverTimestamp()
      });
    } else {
      const otherUid = currentView;
      const chatId = dmChatId(currentUser.uid, otherUid);
      await db.collection("dms").doc(chatId).collection("messages").add({
        uid: currentUser.uid,
        username: currentUsername,
        text: text,
        createdAt: FieldValue.serverTimestamp()
      });
      await db.collection("dms").doc(chatId).set({
        participants: [currentUser.uid, otherUid],
        lastText: text,
        lastAt: FieldValue.serverTimestamp(),
        unread: {
          [otherUid]: FieldValue.increment(1),
          [currentUser.uid]: 0
        }
      }, { merge: true });
    }
  } catch (err) {
    alert("Message failed to send: " + (err.message || err));
  } finally {
    $("send-btn").disabled = false;
    input.focus();
  }
});
 
/* ============================================================
   TYPING INDICATOR
============================================================= */
function typingCollectionRef(){
  if (currentView === "clan") return db.collection("typingClan");
  const chatId = dmChatId(currentUser.uid, currentView);
  return db.collection("dms").doc(chatId).collection("typing");
}
 
function subscribeTyping(){
  if (unsubTyping) { unsubTyping(); unsubTyping = null; }
  typingCache = {};
  $("typing-indicator").classList.add("hidden");
 
  unsubTyping = typingCollectionRef().onSnapshot((qs) => {
    typingCache = {};
    qs.forEach(doc => {
      if (doc.id !== currentUser.uid) typingCache[doc.id] = doc.data();
    });
    renderTypingIndicator();
  });
}
 
function renderTypingIndicator(){
  const el = $("typing-indicator");
  const now = Date.now();
  const names = Object.values(typingCache)
    .filter(t => t.updatedAt && t.updatedAt.toDate && (now - t.updatedAt.toDate().getTime()) < TYPING_TIMEOUT_MS)
    .map(t => t.username);
 
  if (names.length === 0) {
    el.classList.add("hidden");
    el.textContent = "";
    return;
  }
  let text;
  if (names.length === 1) text = `${names[0]} is typing…`;
  else if (names.length === 2) text = `${names[0]} and ${names[1]} are typing…`;
  else text = `${names.length} people are typing…`;
  el.textContent = text;
  el.classList.remove("hidden");
}
 
function writeTypingFlag(){
  if (!currentUser) return;
  const now = Date.now();
  if (now - lastTypingWriteAt < TYPING_THROTTLE_MS) return;
  lastTypingWriteAt = now;
  typingCollectionRef().doc(currentUser.uid).set({
    username: currentUsername,
    updatedAt: FieldValue.serverTimestamp()
  }).catch(()=>{});
}
 
function clearTypingFlag(){
  if (!currentUser) return;
  lastTypingWriteAt = 0;
  typingCollectionRef().doc(currentUser.uid).delete().catch(()=>{});
}
 
$("message-input").addEventListener("input", () => {
  if ($("message-input").value.length > 0) {
    writeTypingFlag();
  } else {
    clearTypingFlag();
  }
});
 
/* ============================================================
   MOBILE ROSTER TOGGLE
============================================================= */
$("menu-toggle").addEventListener("click", () => {
  $("roster-panel").classList.toggle("open");
  $("roster-backdrop").classList.toggle("open");
});
$("roster-backdrop").addEventListener("click", closeMobileRoster);
function closeMobileRoster(){
  $("roster-panel").classList.remove("open");
  $("roster-backdrop").classList.remove("open");
}
