      </div>
      <div class="field">
        <label>Password</label>

    </form>
 
    <div class="auth-switch">
      <span id="switch-to-register">New Tenno? <a>Create an account</a></span>
      <span id="switch-to-login" class="hidden">Already enlisted? <a>Sign in</a></span>
    </div>
  </div>
</div>
 
<!-- ================= CHAT SCREEN ================= -->
<div id="chat-screen" class="hidden">
  <div class="topbar">
    <button id="menu-toggle">☰</button>
    <div class="clan-name">VOIDMARK <span>DYNASTY</span></div>
    <div class="spacer"></div>
    <div class="me-tag">Signed in as <b id="me-username"></b></div>

  <div class="body-wrap">

      <div class="roster-list" style="padding-top:10px;">

          <div class="dot-icon"></div> Clan Comms
        </div>

<script>
/* ============================================================
   FIREBASE INIT
============================================================= */
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;
 
const FAKE_DOMAIN = "@voidmark.clan";
const HEARTBEAT_MS = 20000;
const ONLINE_WINDOW_MS = 45000;
 
let currentUser = null;      // firebase auth user
let currentUsername = null;
let currentView = "clan";    // "clan" or a uid for DM
let usersCache = {};         // uid -> {username, mainFrame, lastSeen}
let dmMetaCache = {};        // chatId -> {participants, unread}
let unsubClanChat = null;
let unsubDM = null;
let unsubDMMeta = null;
let heartbeatTimer = null;
let tickTimer = null;
 
/* ============================================================
   HELPERS
============================================================= */
function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function initials(name){
  return (name || "?").slice(0,2).toUpperCase();
}
function dmChatId(uidA, uidB){
  return [uidA, uidB].sort().join("_");
}
function formatTime(ts){
  if (!ts || !ts.toDate) return "sending…";
  const d = ts.toDate();
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return sameDay ? time : d.toLocaleDateString([], {month:'short', day:'numeric'}) + " " + time;
}
function showAuthError(msg){
  const el = $("auth-error");
  el.textContent = msg;
  el.classList.remove("hidden");
}
function clearAuthError(){
  $("auth-error").classList.add("hidden");
}
function friendlyAuthError(err){
  const code = err && err.code;
  if (code === "auth/user-not-found" || code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials")
    return "Invalid username or password.";
  if (code === "auth/email-already-in-use")
    return "That username is already taken.";
  if (code === "auth/weak-password")
    return "Password must be at least 6 characters.";
  if (code === "auth/invalid-email")
    return "That username isn't valid.";
  if (code === "auth/too-many-requests")
    return "Too many attempts. Wait a moment and try again.";
  return err && err.message ? err.message : "Something went wrong.";
}
 
/* ============================================================
   AUTH SCREEN — LOGIN / REGISTER TOGGLE
============================================================= */
$("switch-to-register").querySelector("a").addEventListener("click", () => {
  clearAuthError();
  $("login-form").classList.add("hidden");
  $("register-form").classList.remove("hidden");
  $("switch-to-register").classList.add("hidden");
  $("switch-to-login").classList.remove("hidden");
  $("auth-mode-sub").textContent = "Create your Tenno account for the clan";
});
$("switch-to-login").querySelector("a").addEventListener("click", () => {
  clearAuthError();
  $("register-form").classList.add("hidden");
  $("login-form").classList.remove("hidden");
  $("switch-to-login").classList.add("hidden");
  $("switch-to-register").classList.remove("hidden");
  $("auth-mode-sub").textContent = "Sign in to the clan comm channel";
});
 
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAuthError();
  const username = $("login-username").value.trim();
  const password = $("login-password").value;
  if (!username || !password) return;
  $("login-btn").disabled = true;
  try {
    const email = username.toLowerCase() + FAKE_DOMAIN;
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    showAuthError(friendlyAuthError(err));
  } finally {
    $("login-btn").disabled = false;
  }
});
 
$("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAuthError();
  const username = $("reg-username").value.trim();
  const password = $("reg-password").value;
  const mainFrame = $("reg-frame").value.trim();
  if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
    showAuthError("Username must be 3-20 characters: letters, numbers, underscore.");
    return;
  }
  $("register-btn").disabled = true;
  try {
    const email = username.toLowerCase() + FAKE_DOMAIN;
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection("users").doc(cred.user.uid).set({
      username: username,
      usernameLower: username.toLowerCase(),
      mainFrame: mainFrame || "",
      createdAt: FieldValue.serverTimestamp(),
      lastSeen: FieldValue.serverTimestamp()
    });
  } catch (err) {
    showAuthError(friendlyAuthError(err));
    $("register-btn").disabled = false;
  }
});
 
/* ============================================================
   AUTH STATE
============================================================= */
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    const snap = await db.collection("users").doc(user.uid).get();
    const data = snap.exists ? snap.data() : {username: user.email.split("@")[0]};
    currentUsername = data.username;
    enterChatScreen();
  } else {
    currentUser = null;
    exitChatScreen();
  }
});
 
$("logout-btn").addEventListener("click", () => {
  auth.signOut();
});
 
/* ============================================================
   ENTER / EXIT CHAT SCREEN
============================================================= */
function enterChatScreen(){
  $("auth-screen").classList.add("hidden");
  $("chat-screen").classList.remove("hidden");
  $("me-username").textContent = currentUsername;
 
  subscribeRoster();
  subscribeDMMeta();
  openClanChat();
  startHeartbeat();
 
  window.addEventListener("beforeunload", markOffline);
}
 
function exitChatScreen(){
  $("chat-screen").classList.add("hidden");
  $("auth-screen").classList.remove("hidden");
  $("login-username").focus();
 
  if (unsubClanChat) unsubClanChat();
  if (unsubDM) unsubDM();
  if (unsubDMMeta) unsubDMMeta();
  stopHeartbeat();
  usersCache = {};
  dmMetaCache = {};
}
 
/* ============================================================
   PRESENCE (heartbeat-based, no Realtime DB needed)
============================================================= */
function startHeartbeat(){
  touchPresence();
  heartbeatTimer = setInterval(touchPresence, HEARTBEAT_MS);
  tickTimer = setInterval(renderRoster, 10000);
}
function stopHeartbeat(){
  clearInterval(heartbeatTimer);
  clearInterval(tickTimer);
}
function touchPresence(){
  if (!currentUser) return;
  db.collection("users").doc(currentUser.uid).update({
    lastSeen: FieldValue.serverTimestamp()
  }).catch(()=>{});
}
function markOffline(){
  if (!currentUser) return;
  navigator.sendBeacon && db.collection("users").doc(currentUser.uid).update({
    lastSeen: firebase.firestore.Timestamp.fromDate(new Date(Date.now() - ONLINE_WINDOW_MS - 1000))
  }).catch(()=>{});
}
 
/* ============================================================
   ROSTER
============================================================= */
function subscribeRoster(){
  db.collection("users").orderBy("usernameLower").onSnapshot((qs) => {
    usersCache = {};
    qs.forEach(doc => { usersCache[doc.id] = doc.data(); });
    renderRoster();
  });
}
 
function renderRoster(){
  const list = $("roster-list");
  const ids = Object.keys(usersCache).filter(id => id !== (currentUser && currentUser.uid));
  $("member-count").textContent = Object.keys(usersCache).length;
 
  if (ids.length === 0) {
    list.innerHTML = '<div class="system-note" style="padding:14px 4px;">No other Tenno enlisted yet.</div>';
    return;
  }
 
  list.innerHTML = ids.map(uid => {
    const u = usersCache[uid];
    const online = isOnline(u.lastSeen);
    const chatId = currentUser ? dmChatId(currentUser.uid, uid) : null;
    const meta = dmMetaCache[chatId];
    const unread = meta && meta.unread && meta.unread[currentUser.uid] ? meta.unread[currentUser.uid] : 0;
    const active = currentView === uid ? "active" : "";
    return `
      <div class="roster-item ${active}" data-uid="${uid}">
        <div class="avatar">${escapeHtml(initials(u.username))}<div class="status-dot ${online ? 'online':''}"></div></div>
        <div class="roster-item-info">
          <div class="roster-item-name">${escapeHtml(u.username)}</div>
          <div class="roster-item-sub">${u.mainFrame ? escapeHtml(u.mainFrame) : (online ? "Online" : "Offline")}</div>
        </div>
        ${unread > 0 ? `<div class="unread-badge">${unread > 9 ? '9+' : unread}</div>` : ""}
      </div>`;
  }).join("");
 
  list.querySelectorAll(".roster-item").forEach(el => {
    el.addEventListener("click", () => {
      openDM(el.getAttribute("data-uid"));
      closeMobileRoster();
    });
  });
}
 
function isOnline(lastSeen){
  if (!lastSeen || !lastSeen.toDate) return false;
  return (Date.now() - lastSeen.toDate().getTime()) < ONLINE_WINDOW_MS;
}
 
/* track unread badges across all my DMs */
function subscribeDMMeta(){
  db.collection("dms").where("participants", "array-contains", currentUser.uid)
    .onSnapshot((qs) => {
      dmMetaCache = {};
      qs.forEach(doc => { dmMetaCache[doc.id] = doc.data(); });
      renderRoster();
    });
}
 
/* ============================================================
   CLAN CHAT (public channel)
============================================================= */
$("nav-clan-chat").addEventListener("click", () => {
  openClanChat();
  closeMobileRoster();
});
 
function openClanChat(){
  currentView = "clan";
  $("nav-clan-chat").classList.add("active");
  $("chat-title").textContent = "Clan Comms";
  $("chat-subtitle").textContent = "Visible to all of Voidmark Dynasty";
  $("message-input").placeholder = "Message the clan…";
  renderRoster();
 
  if (unsubDM) { unsubDM(); unsubDM = null; }
  if (unsubClanChat) unsubClanChat();
 
  $("messages").innerHTML = '<div class="system-note">Loading transmissions…</div>';
  unsubClanChat = db.collection("clanChat").orderBy("createdAt", "asc").limitToLast(200)
    .onSnapshot((qs) => {
      const msgs = [];
      qs.forEach(doc => msgs.push(doc.data()));
      renderMessages(msgs);
    });
}
 
/* ============================================================
   PRIVATE MESSAGES
============================================================= */
function openDM(uid){
  currentView = uid;
  $("nav-clan-chat").classList.remove("active");
  const u = usersCache[uid] || {username: "Unknown"};
  $("chat-title").textContent = u.username;
  $("chat-subtitle").textContent = "Private message · not visible to other clan members";
  $("message-input").placeholder = `Message ${u.username}…`;
  renderRoster();
 
  if (unsubClanChat) { unsubClanChat(); unsubClanChat = null; }
  if (unsubDM) unsubDM();
 
  const chatId = dmChatId(currentUser.uid, uid);
 
  // reset my unread count for this thread
  db.collection("dms").doc(chatId).set({
    participants: [currentUser.uid, uid],
    unread: { [currentUser.uid]: 0 }
  }, { merge: true }).catch(()=>{});
 
  $("messages").innerHTML = '<div class="system-note">Loading transmissions…</div>';
  unsubDM = db.collection("dms").doc(chatId).collection("messages")
    .orderBy("createdAt", "asc").limitToLast(200)
    .onSnapshot((qs) => {
      const msgs = [];
      qs.forEach(doc => msgs.push(doc.data()));
      renderMessages(msgs);
    });
}
 
/* ============================================================
   RENDER MESSAGES
============================================================= */
function renderMessages(msgs){
  const box = $("messages");
  const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
 
  if (msgs.length === 0) {
    box.innerHTML = '<div class="system-note">No transmissions yet. Say something to the Dynasty.</div>';
    return;
  }
 
  box.innerHTML = msgs.map(m => {
    const own = currentUser && m.uid === currentUser.uid;
    return `
      <div class="msg-row ${own ? 'own':''}">
        <div class="msg-avatar">${escapeHtml(initials(m.username))}</div>
        <div class="msg-body">
          <div class="msg-meta">
            <span class="msg-author">${escapeHtml(m.username)}</span>
            <span class="msg-time">${formatTime(m.createdAt)}</span>
          </div>
          <div class="msg-text">${escapeHtml(m.text)}</div>
        </div>
      </div>`;
  }).join("");
 
  if (wasAtBottom || msgs[msgs.length-1].uid === (currentUser && currentUser.uid)) {
    box.scrollTop = box.scrollHeight;
  }
}
 
/* ============================================================
   SENDING MESSAGES
============================================================= */
$("composer-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("message-input");
  const text = input.value.trim();
  if (!text || !currentUser) return;
  input.value = "";
  $("send-btn").disabled = true;
 
  try {
    if (currentView === "clan") {
      await db.collection("clanChat").add({
        uid: currentUser.uid,
        username: currentUsername,
        text: text,
        createdAt: FieldValue.serverTimestamp()
      });
    } else {
      const otherUid = currentView;
      const chatId = dmChatId(currentUser.uid, otherUid);
      await db.collection("dms").doc(chatId).collection("messages").add({
        uid: currentUser.uid,
        username: currentUsername,
        text: text,
        createdAt: FieldValue.serverTimestamp()
      });
      await db.collection("dms").doc(chatId).set({
        participants: [currentUser.uid, otherUid],
        lastText: text,
        lastAt: FieldValue.serverTimestamp(),
        unread: {
          [otherUid]: FieldValue.increment(1),
          [currentUser.uid]: 0
        }
      }, { merge: true });
    }
  } catch (err) {
    alert("Message failed to send: " + (err.message || err));
  } finally {
    $("send-btn").disabled = false;
    input.focus();
  }
});
 
/* ============================================================
   MOBILE ROSTER TOGGLE
============================================================= */
$("menu-toggle").addEventListener("click", () => {
  $("roster-panel").classList.toggle("open");
  $("roster-backdrop").classList.toggle("open");
});
$("roster-backdrop").addEventListener("click", closeMobileRoster);
function closeMobileRoster(){
  $("roster-panel").classList.remove("open");
  $("roster-backdrop").classList.remove("open");
}
</script>
</body>
</html>
